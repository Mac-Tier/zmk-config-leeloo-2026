# Friendly USB and Bluetooth device name.
CONFIG_ZMK_KEYBOARD_NAME="Leeloo"

# Enter idle mode after 5 minutes of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Enable ZMK Display Subsystem
CONFIG_ZMK_DISPLAY=y

# Enable widgets and built-in status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Rotary Encoders Support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow Support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y

# Enable ZMK Studio runtime configuration
CONFIG_ZMK_STUDIO=y

# Ensure storage is enabled so changes persist across power cycles
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
